[workspace]
name = "xcal-geometry"
description = "Cone-beam geometry calibration from a ball phantom"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
python = ">=3.10"
numpy = "*"
scipy = "*"
astropy = "*"
matplotlib-base = "*"

[tasks]
calibrate = "python xcal_geometry.py"

[feature.test.dependencies]
pytest = "*"

[feature.test.tasks]
test = "pytest tests"

[environments]
test = ["test"]
